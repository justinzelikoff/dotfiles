# ~/.config/hypr/hypridle.conf

general {
    # We don't suspend; we just lock + manage DPMS.
    before_sleep_cmd = hyprlock
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# --- Idle flow: lock at 5 min ---
listener {
    timeout = 300                      # 5 minutes
    on-timeout = hyprlock              # lock the session
    on-resume  = hyprctl dispatch dpms on
}

# --- Idle flow: turn screens off 30s after lock (5m30s total) ---
listener {
    timeout = 330                      # 5m 30s total
    # Only power off if hyprlock is actually running (prevents accidental black screen).
    on-timeout = bash -c 'pidof hyprlock >/dev/null && hyprctl dispatch dpms off'
    on-resume  = hyprctl dispatch dpms on
}

# --- Manual lock flow: if you lock yourself, turn screens off after 30s ---
listener {
    timeout = 30
    on-timeout = bash -c 'pidof hyprlock >/dev/null && hyprctl dispatch dpms off'
    on-resume  = hyprctl dispatch dpms on
}
