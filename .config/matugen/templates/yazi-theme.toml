[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
selected = { fg = "{{colors.on_tertiary_container.default.hex}}", bg = "{{colors.tertiary_container.default.hex}}" }
find_keyword = { fg = "{{colors.tertiary.default.hex}}", bold = true }
find_other = { fg = "{{colors.secondary.default.hex}}" }
marker_copied = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }
marker_cut = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
select_main = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
select_alt = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
unset_main = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
unset_alt = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[status]
progress_label = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
progress_error = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[input]
border = { fg = "{{colors.primary.default.hex}}" }
title = { fg = "{{colors.on_surface.default.hex}}" }
value = { fg = "{{colors.on_surface.default.hex}}" }
selected = { bg = "{{colors.secondary_container.default.hex}}" }

[select]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.tertiary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface.default.hex}}" }

[completion]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.on_secondary_container.default.hex}}", bg = "{{colors.secondary_container.default.hex}}" }
inactive = { fg = "{{colors.on_surface.default.hex}}" }
