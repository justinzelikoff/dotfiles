# yazi.toml

[mgr]
show_hidden = true

[opener]
libreoffice = [
	{ run = 'libreoffice "$@"', detach = true, desc = "LibreOffice" }
]
firefox = [
	{ run = 'firefox "$@"', detach = true, desc = "Firefox" }
]
nvim = [
	{ run = 'nvim "%s"', block = true, desc = "Neovim" }
]
mpv = [
	{ run = 'mpv --force-window=yes "$@"', detach = true, desc = "MPV Player" }
]

[open]
prepend_rules = [
	# 1. PDFs strictly to Firefox
	{ mime = "application/pdf", use = "firefox" },
	{ url = "*.pdf", use = "firefox" },

	# 2. Audio & Video strictly to MPV
	{ mime = "audio/*", use = "mpv" },
	{ mime = "video/*", use = "mpv" },
	{ url = "*.{mp3,flac,wav,aac,ogg,mkv,mp4,webm}", use = "mpv" },

	# 3. Images to Firefox
	{ mime = "image/*", use = "firefox" },
	{ url = "*.{png,jpg,jpeg,webp,gif,svg}", use = "firefox" },

	# 4. Office Documents & Spreadsheets -> LibreOffice
	{ mime = "text/csv", use = "libreoffice" },
	{ mime = "application/vnd.ms-excel", use = "libreoffice" },
	{ mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", use = "libreoffice" },
	{ mime = "application/vnd.oasis.opendocument.spreadsheet", use = "libreoffice" },
	{ mime = "application/msword", use = "libreoffice" },
	{ mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document", use = "libreoffice" },
	{ mime = "application/vnd.oasis.opendocument.text", use = "libreoffice" },
	{ url = "*.{csv,xlsx,xls,ods,doc,docx,odt}", use = "libreoffice" },

	# 5. ALL Text files & Code strictly to Neovim
	{ mime = "text/*", use = "nvim" },
	{ mime = "application/{json,javascript,xml,toml,x-yaml,x-sh,x-shellscript}", use = "nvim" },
	{ url = "*.{txt,py,sh,md,toml,conf,json,yaml,yml,c,cpp,h,rs,go,js,ts,css,html,ini,log}", use = "nvim" }
]

append_rules = [
	{ mime = "*", use = "nvim" }
]
