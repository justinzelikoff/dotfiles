[opener]
gnome-image = [
	{ run = 'loupe "$@"', detach = true, desc = "GNOME Image Viewer" }
]
gnome-pdf = [
	{ run = 'evince "$@"', detach = true, desc = "GNOME Document Viewer" }
]
vim = [
	{ run = 'vim "$@"', block = true, desc = "Vim" }
]

[open]
rules = [
	# 1. Images
	{ mime = "image/*", use = "gnome-image" },

	# 2. General Text (Files with content)
	{ mime = "text/*",  use = "vim" },

	# 3. Programming & Config (Fixes blank files like test.py)
	# We put these ABOVE the PDF rule so blank code files hit Vim first.
	{ name = "*.py",   mime = "*", use = "vim" },
	{ name = "*.sh",   mime = "*", use = "vim" },
	{ name = "*.md",   mime = "*", use = "vim" },
	{ name = "*.toml", mime = "*", use = "vim" },
	{ name = "*.conf", mime = "*", use = "vim" },

	# 4. PDFs (Specific extension)
	{ name = "*.pdf", mime = "*", use = "gnome-pdf" },

	# 5. Final Fallback for anything else
	# If it's a blank file with no extension, it will hit here and use Vim.
	{ mime = "*", use = "vim" }
]

