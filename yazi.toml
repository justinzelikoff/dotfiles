[opener]
gnome-image = [
	{ run = 'loupe "$@"', detach = true, desc = "GNOME Image Viewer" }
]
gnome-pdf = [
	{ run = 'evince "$@"', detach = true, desc = "GNOME Document Viewer" }
]
vim = [
	{ run = 'vim "$@"', block = true, desc = "Vim" }
]

[open]
rules = [
	# 1. Images First
	{ mime = "image/*", use = "gnome-image" },

	# 2. General Text Files (Highest priority for Vim)
	# By putting this here, .txt and standard text files hit Vim first.
	{ mime = "text/*",  use = "vim" },

	# 3. PDF Specific (The parser needs mime="*", but we keep it below text/*)
	{ name = "*.pdf", mime = "*", use = "gnome-pdf" },

	# 4. Specific Config Extensions (Also for Vim)
	{ name = "*.md",   mime = "*", use = "vim" },
	{ name = "*.toml", mime = "*", use = "vim" },
	{ name = "*.conf", mime = "*", use = "vim" },

	# 5. Final Fallback
	# This ensures if nothing else matches (and it's not a PDF/Image), it's Vim.
	{ mime = "*", use = "vim" }
]
