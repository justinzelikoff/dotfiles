[opener]
firefox = [
	{ run = 'firefox "$@"', detach = true, desc = "Firefox" }
]
nvim = [
	{ run = 'nvim "$@"', block = true, desc = "Neovim" }
]
mpv = [
	{ run = 'mpv --force-window=yes "$@"', detach = true, desc = "MPV Player" }
]

[open]
prepend_rules = [
	# 1. PDFs
	{ url = "*.pdf", use = "firefox" },
	{ mime = "application/pdf", use = "firefox" },

	# 2. Audio & Video
	{ mime = "audio/*", use = "mpv" },
	{ mime = "video/*", use = "mpv" },
	{ url = "*.{mp3,flac,wav,aac,ogg,mkv,mp4,webm}", use = "mpv" },

	# 3. Images
	{ mime = "image/*", use = "firefox" },
	{ url = "*.{png,jpg,jpeg,webp,gif,svg}", use = "firefox" },

	# 4. Spreadsheets (Must stay ABOVE text/* so CSV doesn't open in nvim)
	{ mime = "text/csv", use = "firefox" },
	{ mime = "application/vnd.ms-excel", use = "firefox" },
	{ mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", use = "firefox" },
	{ mime = "application/vnd.oasis.opendocument.spreadsheet", use = "firefox" },
	{ url = "*.{csv,xlsx,xls,ods}", use = "firefox" },

	# 5. ALL Text files, system configs, & source code
	{ mime = "text/*", use = "nvim" },
	{ mime = "application/{json,javascript,xml,toml,x-yaml,x-sh,x-shellscript}", use = "nvim" },
	{ url = "*.{txt,py,sh,md,toml,conf,json,yaml,yml,c,cpp,h,rs,go,js,ts,css,html,ini,log}", use = "nvim" }
]

append_rules = [
	# Absolute fallback for unknown/empty files
	{ mime = "*", use = "nvim" }
]
